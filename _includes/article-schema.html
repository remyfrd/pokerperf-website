{%- assign t = site.data.i18n[page.lang] | default: site.data.i18n.fr -%}
{%- assign img = page.og_image | default: "/assets/img/og-cover.png" | absolute_url -%}
{%- assign mod = page.last_modified_at | default: page.date -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Article",
      "headline": {{ page.headline | default: page.title | jsonify }},
      "description": {{ page.description | jsonify }},
      "inLanguage": "{{ page.lang }}",
      "mainEntityOfPage": { "@type": "WebPage", "@id": "{{ page.url | absolute_url }}" },
      {% if page.date %}"datePublished": "{{ page.date | date_to_xmlschema }}", "dateModified": "{{ mod | date_to_xmlschema }}",{% endif %}
      "image": "{{ img }}",
      "author": { "@id": "https://pokerperf.com/#org" },
      "publisher": { "@id": "https://pokerperf.com/#org" }
    },
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": {{ t.crumb_home | jsonify }}, "item": "{{ t.home_url | absolute_url }}" },
        { "@type": "ListItem", "position": 2, "name": {{ t.crumb_guides | jsonify }}, "item": "{{ t.guides_url | absolute_url }}" },
        { "@type": "ListItem", "position": 3, "name": {{ page.headline | default: page.title | jsonify }}, "item": "{{ page.url | absolute_url }}" }
      ]
    }
  ]
}
</script>
