<svg viewBox="0 0 600 170" role="img" aria-label="{% if page.lang == 'en' %}Rule of 4 and 2: outs times 4 gives your equity{% else %}Règle du 4 et 2 : les outs multipliés par 4 donnent ton équité{% endif %}" preserveAspectRatio="xMidYMid meet">
  <style>
    .pill{fill:oklch(0.86 0.06 88 / .16);stroke:oklch(0.86 0.06 88);stroke-width:1.5}
    .pillt{fill:oklch(0.9 0.05 90);font:700 22px "IBM Plex Mono",monospace}
    .op{fill:oklch(0.86 0.06 88);font:700 46px "Cormorant Garamond",serif}
    .pct{fill:#17202a;font:700 20px "IBM Plex Mono",monospace}
    .cap{fill:oklch(0.8 0.05 95);font:500 14px "IBM Plex Mono",monospace;letter-spacing:.04em}
  </style>
  <!-- outs -->
  <rect class="pill" x="24" y="52" width="120" height="48" rx="24"/>
  <text class="pillt" x="84" y="84" text-anchor="middle">9 outs</text>
  <!-- × 4 -->
  <text class="op" x="196" y="92" text-anchor="middle">× 4</text>
  <text class="op" x="256" y="90" text-anchor="middle">=</text>
  <!-- barre équité 36% -->
  <rect x="300" y="56" width="276" height="40" rx="20" fill="oklch(0.82 0.06 85 / .14)"/>
  <rect x="300" y="56" width="99" height="40" rx="20" fill="oklch(0.86 0.06 88)"/>
  <text class="pct" x="349" y="81" text-anchor="middle">≈ 36 %</text>
  <!-- légende -->
  <text class="cap" x="300" y="138" text-anchor="middle">{% if page.lang == 'en' %}× 4 on the flop · × 2 with one card to come{% else %}× 4 au flop · × 2 s'il reste une carte{% endif %}</text>
</svg>
